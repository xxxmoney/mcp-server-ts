name: Publish Package

on:
  push:
    branches:
      - master # TODO: maybe first test on curent branch?

permissions:
  id-token: write
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Build App
        working-directory: .
        run: |
            npm ci
            npm run build
            npm test
            npm publish

      - name: Get Version
        id: version
        working-directory: .
        run: |
          APP_VERSION=$(node -p "require('./package.json').version")
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ steps.version.outputs.APP_VERSION }}"
          name: "v${{ steps.version.outputs.APP_VERSION }}"
          generate_release_notes: true
